# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - bill-splitter

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install dependencies for all workspaces
        run: |
          npm install
          cd server && npm install
          cd ../client && npm install

      - name: Build and test
        run: |
          npm run build --if-present
          npm run test --if-present

      - name: Copy built client files to root
        run: |
          cp -r client/dist/* .

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      
      - name: Install production dependencies
        run: |
          npm ci --only=production
          cd server && npm ci --only=production
      
      - name: Install PM2 globally
        run: npm install -g pm2
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C456202697CD423EA7AE50AF86921120 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4174CB9D17DE469D9C25DC96A09A5A1B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C2EF0F638A7740F4883B66ADDC809656 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bill-splitter'
          slot-name: 'Production'
          package: .
          