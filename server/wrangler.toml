name = "bill-splitter-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"
MAX_PARTICIPANTS = "50"
MAX_EXPENSES = "500"
MAX_TOTAL_SPLITS = "10000"
SPLIT_EXPIRY_HOURS = "24"

[[d1_databases]]
binding = "DB"
database_name = "bill-splitter-db"
database_id = "046c8d44-f049-4a32-b9e4-3c28cee2391f"

[dev]
port = 3001

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true
